    <!-- Formulario de Contacto -->
    <div class="container">
        <div class="mb-4" id="formulario">
            <h3 class="text-center">CONTACTENOS</h3>
            <p class="text-center">
                ¿Tienes alguna duda o Pregunta?
                <br> Por Favor contactanos directamente.
            </p>
            <div class="row">
                <div class="col-md-9">
                    <form action="">
                        <div class="row">
                            <div class="col-md-6 text-center">
                                <div class="md-form">
                                    <input type="text" id="name" class="form-control" placeholder="Nombre Completo" required>
                                </div>
                            </div>
                            <div class="col-md-6 text-center">
                                <div class="md-form">
                                    <input type="text" id="email" class="form-control" placeholder="Correo Electronico">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 text-center">
                                <div class="md-form">
                                    <input type="text" id="subject" class="form-control"
                                        placeholder="Asunto del Mensaje">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                                <div class="md-form text-center">
                                    <textarea type="text" id="message" class="form-control"
                                        placeholder="Escribe tu Mensaje"></textarea>
                                </div>
                            </div>
                        </div>
                    </form>
                    <!-- Boton de Enviar -->
                    <div class="text-center">
                        <button type="submit" class="btn btn-outline-primary">ENVIAR</button>
                    </div>
                </div>
                <!-- Seccion de Informacion -->
                <div class="col-md-3 text-center">
                    <ul class="list-unstyled">
                        <li><i class="bi bi-geo-alt" style="color: #00008b;"></i>
                            <p>Masaya, Masaya. NIC</p>
                        </li>
                        <li><i class="bi bi-telephone" style="color: #00008b;"></i>
                            <p>+505 8888 - 00000</p>
                        </li>
                        <li><i class="bi bi-envelope" style="color: #00008b;"></i>
                            <p>contactanos@tiendajazmin.com</p>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <!-- Fin de Formulario de Contacto -->
