<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<link

/>

<link

/>
<!-- MDB -->
<link
href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.css"
rel="stylesheet"
/>
<!-- MDB -->
<script
  type="text/javascript"
  src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.js"
></script>
    <title>Document</title>
</head>
<body>
    <!-- Modal gallery -->
        <div class="col-lg-4 mb-4 mb-lg-0">
          <div
            class="bg-image hover-overlay ripple shadow-1-strong rounded"
            data-ripple-color="light"
          >
            <img
              src="https://cdn.ethic.es/wp-content/uploads/2023/03/imagen.jpg"
              class="w-100"
            />
            <a href="#!" data-mdb-toggle="modal" data-mdb-target="#exampleModal3">
              <div class="mask" style="background-color: rgba(251, 251, 251, 0.2);"></div>
            </a>
          </div>
        </div>
      </div>
    </section>
    <!-- Section: Images -->
  
    <!-- Section: Modals -->
    <section class="">
    
        <!-- Modal 3 -->
        <div class="modal fade" id="exampleModal3" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <!--Esta abre la imagen-->
                <div class="modal-content">
                    <!--Esto mantiene enmarcado la imagen-->
                    <div class="ratio ratio-16x9">
                        <!-- centra imagen -->
                        <img src="https://cdn.ethic.es/wp-content/uploads/2023/03/imagen.jpg"></img>
                    </div>
                    <div class="text-center py-3">
                        <button type="button" class="btn btn-secondary" data-mdb-dismiss="modal">
                            Close
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Section: Modals -->
  </section>
  <!-- Modal gallery -->
</body>
